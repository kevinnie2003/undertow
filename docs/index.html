<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Undertow · Meridian-9</title>
  <style>
/*
 * Undertow: a station instrument panel and a crew logbook.
 * Flat dark surfaces, hairline rules, square corners, one sodium-lamp accent.
 * No web fonts: the stacks below fall back to good system faces, CJK included.
 */
:root {
  --ink: #0c1213;
  --ink-2: #111819;
  --ink-3: #172122;
  --rule: #253132;
  --rule-strong: #3a4a4b;
  --fg: #dde3df;
  --fg-2: #9aa7a2;
  --fg-3: #66746f;
  --sodium: #f08a2c;
  --sodium-dim: #7a4a1f;
  --crew: #7ec3b2;
  --under: #e5573f;
  --warn: #d8b24c;
  --night: #8fb0c8;

  --mono: 'JetBrains Mono', 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Ubuntu Mono', 'Liberation Mono', 'PingFang SC', 'Microsoft YaHei', monospace;
  --sans: 'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif;
  --display: 'Barlow Condensed', 'Roboto Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Microsoft YaHei', sans-serif;

  /* Type scale: 11 / 13 / 15 / 18 / 28 / 60 */
  --t-xs: 11px;
  --t-sm: 13px;
  --t-md: 15px;
  --t-lg: 18px;
  --t-xl: 28px;
  --t-hero: clamp(40px, 6vw, 64px);

  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background: var(--ink);
  color: var(--fg);
  font: 400 var(--t-md) / 1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
[hidden] {
  display: none !important;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--sodium);
  outline-offset: 2px;
}
::selection {
  background: var(--sodium-dim);
}

/* Small caps-style instrument labels. */
.k,
.label,
.kicker,
h2,
h3,
dt,
legend,
.field > span,
.prompt,
.tag,
.badge,
.lock,
summary {
  font-family: var(--mono);
  font-size: var(--t-xs);
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
body[data-lang='zh'] :is(.k, .label, .kicker, h2, h3, dt, legend, .field > span, .prompt, .tag, .badge, .lock, summary, .phase, .divider, .pace, .waiting .status) {
  font-family: var(--sans);
  letter-spacing: 0.04em;
  font-size: 12px;
}
body[data-lang='zh'] .phase {
  font-size: var(--t-sm);
  font-weight: 600;
}

/* ------------------------------------------------------------------ */
/* Header strip                                                        */
/* ------------------------------------------------------------------ */

.bar {
  display: flex;
  align-items: stretch;
  height: 52px;
  border-bottom: 1px solid var(--rule);
  background: var(--ink-2);
  flex: none;
}
.bar > * {
  display: flex;
  align-items: center;
  padding: 0 18px;
  border-right: 1px solid var(--rule);
  gap: 10px;
  white-space: nowrap;
}
.brand .mark {
  font-family: var(--display);
  font-stretch: condensed;
  font-weight: 700;
  font-size: 22px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.brand .sub {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
}
.phase {
  min-width: 200px;
  font-family: var(--mono);
  font-size: var(--t-sm);
  color: var(--sodium);
}
body[data-phase='night'] .phase {
  color: var(--night);
}
body[data-phase='setup'] .phase,
body[data-phase='setup'] #hull {
  display: none;
}
body[data-phase='setup'] #meta {
  visibility: hidden;
}
#hull .k {
  color: var(--fg-3);
}
#hull .segs {
  display: flex;
  gap: 3px;
}
#hull .seg {
  width: 14px;
  height: 10px;
  border: 1px solid var(--fg-2);
}
#hull .seg.ok {
  background: var(--fg-2);
}
#hull .seg.lost {
  border-color: var(--under);
  background: transparent;
}
#hull .num {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
}
.meta {
  flex: 1;
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
  overflow: hidden;
  text-overflow: ellipsis;
}
.lang {
  border-right: 0;
  padding: 0 12px;
  gap: 0;
}
.lang button {
  background: transparent;
  border: 1px solid var(--rule-strong);
  color: var(--fg-2);
  font-family: var(--mono);
  font-size: var(--t-xs);
  padding: 5px 10px;
  cursor: pointer;
  border-radius: 0;
}
.lang button + button {
  border-left: 0;
}
.lang button[aria-pressed='true'] {
  background: var(--fg);
  color: var(--ink);
  border-color: var(--fg);
}

/* ------------------------------------------------------------------ */
/* Controls                                                            */
/* ------------------------------------------------------------------ */

button {
  border: 1px solid var(--rule-strong);
  background: var(--ink-3);
  padding: 8px 14px;
  border-radius: 0;
  cursor: pointer;
  font-family: var(--mono);
  font-size: var(--t-sm);
}
button:hover {
  border-color: var(--fg-2);
}
button.primary {
  background: var(--sodium);
  border-color: var(--sodium);
  color: #1a0f05;
  font-weight: 600;
}
button.primary:hover {
  background: #ff9a3e;
}
button.ghost {
  background: transparent;
  color: var(--fg-2);
}
button.danger {
  border-color: var(--under);
  color: #f3b3a7;
  background: transparent;
}
button.danger:hover {
  background: var(--under);
  color: var(--ink);
}
button.wide {
  width: 100%;
  padding: 13px;
  font-size: var(--t-md);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
input:not([type='radio']):not([type='range']):not([type='file']),
select,
textarea {
  background: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 0;
  padding: 8px 10px;
}
input[type='number'] {
  font-family: var(--mono);
}
.field input,
.field select,
.field textarea {
  width: 100%;
  min-width: 0;
}
input[type='range'],
input[type='radio'] {
  accent-color: var(--sodium);
}
textarea {
  width: 100%;
  resize: vertical;
  line-height: 1.5;
}
.hint,
.note {
  color: var(--fg-3);
  font-size: var(--t-sm);
}
.err {
  color: var(--under);
  font-size: var(--t-sm);
}

/* ------------------------------------------------------------------ */
/* Setup                                                               */
/* ------------------------------------------------------------------ */

.setup {
  flex: 1;
  display: grid;
  grid-template-columns: 64px minmax(0, 1.15fr) minmax(320px, 0.85fr);
  gap: 0 56px;
  max-width: 1240px;
  width: 100%;
  padding: 56px 40px 64px 24px;
}
.gauge {
  position: relative;
  border-right: 1px solid var(--rule-strong);
  margin: 6px 0;
  background: repeating-linear-gradient(to bottom, var(--rule-strong) 0 1px, transparent 1px 2.5%) right / 8px 100% no-repeat,
    repeating-linear-gradient(to bottom, var(--fg-3) 0 1px, transparent 1px 25%) right / 18px 100% no-repeat;
}
.gauge span {
  position: absolute;
  right: 24px;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--fg-3);
}
.gauge span:last-child {
  color: var(--sodium);
}
.intro {
  padding-top: 4px;
}
.kicker {
  color: var(--sodium);
  margin: 0 0 18px;
}
.intro h1 {
  font-family: var(--display);
  font-stretch: condensed;
  font-weight: 700;
  font-size: var(--t-hero);
  line-height: 0.98;
  letter-spacing: -0.005em;
  margin: 0 0 28px;
  max-width: 13ch;
}
body[data-lang='zh'] .intro h1 {
  line-height: 1.15;
  max-width: 11em;
  letter-spacing: 0.02em;
}
.lede {
  font-size: var(--t-lg);
  line-height: 1.6;
  color: var(--fg-2);
  max-width: 34em;
  margin: 0 0 40px;
}
.facts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--rule-strong);
  margin: 0;
  max-width: 36em;
}
.facts div {
  padding: 12px 16px 0 0;
}
.facts div + div {
  border-left: 1px solid var(--rule);
  padding-left: 16px;
}
.facts dt {
  color: var(--fg-3);
  margin-bottom: 4px;
}
.facts dd {
  margin: 0;
  font-size: var(--t-sm);
}
.form {
  border: 1px solid var(--rule);
  background: var(--ink-2);
  padding: 22px 24px 18px;
  align-self: start;
}
.form h2 {
  margin: 0 0 6px;
  color: var(--fg-2);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
}
.field {
  display: grid;
  gap: 6px;
  padding: 12px 0;
  border: 0;
  border-bottom: 1px solid var(--rule);
  margin: 0;
}
.field > span,
.field legend {
  color: var(--fg-3);
  padding: 0;
}
.field output {
  color: var(--fg-2);
  text-transform: none;
  letter-spacing: 0;
}
.field input[type='range'] {
  margin-top: 8px;
}
.modes {
  gap: 4px;
}
.modes legend {
  margin-bottom: 6px;
}
.modes label {
  display: flex;
  gap: 8px;
  align-items: baseline;
  font-size: var(--t-sm);
  cursor: pointer;
}
.pair {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 18px;
}
.pair .field {
  align-content: start;
}
.field output {
  display: block;
  font-family: var(--mono);
  font-size: var(--t-xs);
  margin-top: 2px;
}
.form {
  min-width: 0;
}
#start {
  margin-top: 18px;
}
.note {
  margin: 10px 0 0;
}
.replay-load {
  margin-top: 16px;
  border-top: 1px solid var(--rule);
  padding-top: 10px;
}
.replay-load summary {
  cursor: pointer;
  color: var(--fg-2);
}
.replay-load .field:last-of-type {
  border-bottom: 0;
}

/* ------------------------------------------------------------------ */
/* Game layout                                                         */
/* ------------------------------------------------------------------ */

.game {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 264px minmax(0, 1fr) 320px;
  height: calc(100vh - 52px);
}
.roster-col,
.side {
  overflow-y: auto;
  background: var(--ink-2);
}
.roster-col {
  border-right: 1px solid var(--rule);
}
.roster-col h3,
.side h3 {
  color: var(--fg-3);
  margin: 0;
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--rule);
}
.side {
  border-left: 1px solid var(--rule);
  padding-bottom: 24px;
}
.side h3 {
  margin-top: 18px;
  border-top: 1px solid var(--rule);
}
.side h3:first-child {
  margin-top: 0;
  border-top: 0;
}
.side > .hint,
.side > p,
.side > ul,
.side > div:not(.rolecard),
.side > details {
  margin-left: 16px;
  margin-right: 16px;
}

/* Roster */
.card {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 11px 14px 11px 12px;
  border: 0;
  border-bottom: 1px solid var(--rule);
  border-left: 2px solid transparent;
  background: transparent;
  font-family: var(--sans);
  font-size: var(--t-md);
}
button.card:hover {
  background: var(--ink-3);
}
.card.selected {
  border-left-color: var(--sodium);
  background: var(--ink-3);
}
.card .seat {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
  padding-top: 3px;
}
.card .who {
  display: grid;
  gap: 2px;
  min-width: 0;
}
.card .nm {
  font-weight: 600;
  display: flex;
  align-items: baseline;
  gap: 6px;
  flex-wrap: wrap;
}
.card .job {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
}
.card .dots {
  color: var(--sodium);
}
.card.dead .nm {
  color: var(--fg-3);
  text-decoration: line-through;
  text-decoration-color: var(--rule-strong);
}
.card.you .seat {
  color: var(--sodium);
}
.card.partner {
  border-left-color: var(--under);
}
.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.badges:empty {
  display: none;
}
.badge,
.tag {
  border: 1px solid var(--rule-strong);
  padding: 1px 5px;
  font-size: 10px;
  color: var(--fg-2);
  line-height: 1.5;
}
.badge.role.crew {
  border-color: var(--crew);
  color: var(--crew);
}
.badge.role.undertow,
.tag.undertow {
  border-color: var(--under);
  color: var(--under);
}
.badge.fate {
  color: var(--fg-3);
}
.badge.intent {
  border-color: var(--sodium-dim);
  color: var(--sodium);
}
.susbar {
  height: 2px;
  background: var(--rule);
  margin-top: 6px;
}
.susbar span {
  display: block;
  height: 100%;
  background: var(--sodium);
}

/* ------------------------------------------------------------------ */
/* Log                                                                 */
/* ------------------------------------------------------------------ */

.center {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.log {
  flex: 1;
  overflow-y: auto;
  padding: 22px 32px 32px;
  scroll-behavior: smooth;
}
.log > * {
  max-width: 820px;
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 26px 0 12px;
  font-family: var(--mono);
  font-size: var(--t-xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sodium);
}
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--rule-strong);
}
.divider.night {
  color: var(--night);
}
.sys {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-family: var(--mono);
  font-size: var(--t-sm);
  color: var(--fg-2);
  padding: 5px 0 5px 12px;
  border-left: 2px solid var(--rule-strong);
  margin: 6px 0;
}
body[data-lang='zh'] .sys {
  font-family: var(--sans);
}
.sys.intro {
  color: var(--fg);
  border-left-color: var(--fg-2);
}
.sys.you {
  color: var(--sodium);
  border-left-color: var(--sodium);
}
.sys.death {
  color: #f2a596;
  border-left-color: var(--under);
}
.sys.intel {
  color: var(--crew);
  border-left-color: var(--crew);
}
.sys.undertow {
  color: #f2a596;
  border-left-color: var(--under);
  border-left-style: dashed;
}
.sys.warn {
  color: var(--warn);
  border-left-color: var(--warn);
}
.sys.calm {
  color: var(--fg-3);
}
.lock {
  flex: none;
  font-size: 9.5px;
  color: var(--fg-3);
  border: 1px solid var(--rule-strong);
  padding: 0 4px;
}
.speech {
  display: grid;
  grid-template-columns: 9.5rem minmax(0, 1fr);
  gap: 20px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.speech .speaker {
  display: flex;
  gap: 8px;
  font-family: var(--mono);
  font-size: var(--t-sm);
  padding-top: 2px;
  color: var(--fg-2);
  min-width: 0;
}
.speech .speaker .seat {
  color: var(--fg-3);
  flex: none;
}
.speech .speaker .sn {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.speech.mine .speaker {
  color: var(--sodium);
}
.speech .text {
  margin: 0;
  max-width: 62ch;
}
body[data-lang='zh'] .speech .text {
  max-width: 38em;
  line-height: 1.75;
}
.speech.last .body {
  border-left: 2px solid var(--under);
  padding-left: 12px;
}
.speech.last .tag {
  display: inline-block;
  color: var(--under);
  border-color: var(--under);
  margin-bottom: 4px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 7px;
}
.chips:empty {
  display: none;
}
.chip {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
  border: 1px solid var(--rule-strong);
  padding: 1px 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.chip.hostile {
  color: #f2a596;
  border-color: #6b3328;
}
.chip.vouch,
.chip.scan:not(.hostile) {
  color: var(--crew);
  border-color: #345a51;
}
.chip .x {
  border: 0;
  background: transparent;
  padding: 0 2px;
  color: inherit;
  font-size: var(--t-sm);
  line-height: 1;
}
.votes {
  margin: 10px 0;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  background: var(--ink-2);
  font-family: var(--mono);
  font-size: var(--t-sm);
}
.votes .tally {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
  color: var(--fg);
}
.votes .tally b {
  color: var(--sodium);
  font-weight: 600;
}
.votes .rows {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 16px;
  margin-top: 6px;
  color: var(--fg-3);
  font-size: var(--t-xs);
}
.end {
  margin: 28px 0 8px;
  border-top: 4px solid var(--crew);
  padding-top: 14px;
}
.end.undertow {
  border-top-color: var(--under);
}
.end .big {
  font-family: var(--display);
  font-stretch: condensed;
  font-weight: 700;
  font-size: 40px;
  line-height: 1.05;
  text-transform: uppercase;
}
.end p {
  color: var(--fg-2);
  margin: 6px 0 0;
}

/* ------------------------------------------------------------------ */
/* Actions                                                             */
/* ------------------------------------------------------------------ */

.actions {
  flex: none;
  border-top: 1px solid var(--rule-strong);
  background: var(--ink-2);
  padding: 14px 32px 16px;
}
.actions:empty {
  display: none;
}
.prompt {
  color: var(--sodium);
  margin-bottom: 10px;
}
.targets,
.waiting,
.replay .row,
.composer .row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.waiting .status {
  font-family: var(--mono);
  font-size: var(--t-sm);
  color: var(--fg-2);
  margin-right: auto;
}
.composer .row {
  justify-content: space-between;
  margin-top: 10px;
}
.builder {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-top: 10px;
}
.builder .label {
  color: var(--fg-3);
  margin-right: 4px;
}
.builder select {
  padding: 5px 8px;
  font-size: var(--t-sm);
}
.builder button {
  padding: 5px 12px;
}
.pace {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: var(--t-xs);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--fg-3);
}
.replay .scrub {
  width: 100%;
  margin: 12px 0 8px;
}
.replay .row button {
  min-width: 40px;
}
.replay .pos {
  font-family: var(--mono);
  margin: 0 auto 0 8px;
}
.replay-dump {
  font-family: var(--mono);
  font-size: var(--t-xs);
  height: 80px;
}

/* ------------------------------------------------------------------ */
/* Side panel                                                          */
/* ------------------------------------------------------------------ */

.rolecard {
  padding: 16px;
  border-top: 4px solid var(--crew);
  border-bottom: 1px solid var(--rule);
}
.rolecard.undertow {
  border-top-color: var(--under);
}
.rolecard .rk {
  font-family: var(--mono);
  font-size: var(--t-xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-3);
}
.rolecard .rn {
  font-family: var(--display);
  font-stretch: condensed;
  font-weight: 700;
  font-size: var(--t-xl);
  line-height: 1.15;
  margin: 4px 0 8px;
}
.rolecard p {
  margin: 0 0 8px;
  font-size: var(--t-sm);
  color: var(--fg-2);
}
.rolecard .partners {
  color: var(--under);
}
.intel .sys {
  font-size: var(--t-xs);
}
.setup-list {
  list-style: none;
  padding: 0;
  margin-top: 10px;
  font-size: var(--t-sm);
}
.setup-list li {
  padding: 4px 0;
  border-bottom: 1px solid var(--rule);
  display: flex;
  gap: 10px;
}
.setup-list b {
  font-family: var(--mono);
  min-width: 1.5em;
  color: var(--crew);
}
.setup-list li.undertow b {
  color: var(--under);
}
.rules {
  margin-top: 16px;
}
.rules summary {
  cursor: pointer;
  color: var(--fg-2);
}
.rules p {
  font-size: var(--t-sm);
  color: var(--fg-2);
}
.side > .hint {
  margin-top: 10px;
}
.mindhead {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 12px;
  margin-bottom: 8px;
  font-size: var(--t-lg);
}
.beliefs {
  display: grid;
  gap: 5px;
}
.brow {
  display: grid;
  grid-template-columns: 7.5rem 1fr 2rem;
  gap: 8px;
  align-items: center;
  font-size: var(--t-sm);
}
.brow .bn {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.brow.dead {
  opacity: 0.45;
}
.bbar {
  height: 6px;
  background: var(--rule);
}
.bbar .fill {
  display: block;
  height: 100%;
  background: var(--fg-2);
}
.bbar .fill.crew {
  background: var(--crew);
}
.bbar .fill.undertow {
  background: var(--under);
}
.brow .bv {
  font-family: var(--mono);
  font-size: var(--t-xs);
  color: var(--fg-3);
  text-align: right;
}
.thought,
.notes,
.traces {
  margin-top: 16px;
}
.thought .label,
.notes .label,
.traces .label {
  color: var(--fg-3);
  display: block;
  margin-bottom: 4px;
}
.thought p {
  margin: 0;
  font-size: var(--t-sm);
  border-left: 2px solid var(--sodium);
  padding-left: 10px;
}
.notes ul {
  margin: 0;
  padding-left: 16px;
  font-size: var(--t-sm);
  color: var(--fg-2);
}
.traces details {
  border-top: 1px solid var(--rule);
  padding: 6px 0;
}
.traces summary {
  cursor: pointer;
  color: var(--fg-2);
  text-transform: none;
  letter-spacing: 0;
}
.step {
  font-size: var(--t-xs);
  color: var(--fg-2);
  margin: 6px 0;
}
.step code {
  font-family: var(--mono);
  color: var(--sodium);
}
.step .obs {
  color: var(--fg-3);
  font-family: var(--mono);
  white-space: pre-wrap;
  margin-top: 2px;
}
.step .err {
  font-family: var(--mono);
}

/* ------------------------------------------------------------------ */
/* Narrow screens                                                      */
/* ------------------------------------------------------------------ */

@media (max-width: 1100px) {
  .game {
    grid-template-columns: 220px minmax(0, 1fr);
    height: auto;
  }
  .side {
    grid-column: 1 / -1;
    border-left: 0;
    border-top: 1px solid var(--rule);
  }
  .log {
    max-height: 70vh;
  }
}
@media (max-width: 860px) {
  .setup {
    grid-template-columns: 1fr;
    padding: 32px 20px 48px;
  }
  .gauge {
    display: none;
  }
  .form {
    margin-top: 32px;
  }
  .bar {
    height: auto;
    flex-wrap: wrap;
  }
  .bar > * {
    padding: 10px 12px;
  }
  .brand .sub,
  .meta {
    display: none;
  }
  /* One page scroll on phones: no nested scrolling panes except the log. */
  .game {
    grid-template-columns: 1fr;
    flex: none;
    height: auto;
  }
  .roster-col,
  .side {
    overflow: visible;
  }
  .roster-col {
    border-right: 0;
    border-bottom: 1px solid var(--rule);
  }
  /* The manifest becomes a strip you swipe sideways. */
  .roster {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(168px, 46%);
    overflow-x: auto;
    scroll-snap-type: x proximity;
  }
  .roster .card {
    scroll-snap-align: start;
    border-right: 1px solid var(--rule);
    border-bottom: 0;
  }
  .log {
    max-height: 62vh;
    min-height: 40vh;
  }
  .actions {
    position: sticky;
    bottom: 0;
    z-index: 2;
  }
  .speech {
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .speech .speaker {
    justify-content: flex-start;
    text-align: left;
  }
  .log,
  .actions {
    padding-left: 16px;
    padding-right: 16px;
  }
}

</style>
</head>
<body data-phase="setup">
  <header class="bar">
    <div class="brand"><span class="mark">Undertow</span><span class="sub" data-t="brandSub"></span></div>
    <div class="cell phase"><span id="phase"></span></div>
    <div class="cell" id="hull"></div>
    <div class="cell meta" id="meta"></div>
    <div class="lang" role="group" data-t-aria="langLabel">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </header>

  <main id="setup" class="setup">
    <div class="gauge" aria-hidden="true">
      <span style="top:0%">0 m</span><span style="top:25%">1000</span><span style="top:50%">2000</span><span style="top:75%">3000</span><span style="top:100%">4000</span>
    </div>
    <section class="intro">
      <p class="kicker" data-t="setupKicker"></p>
      <h1 data-t="setupTitle"></h1>
      <p class="lede" data-t="setupLede"></p>
      <dl class="facts">
        <div><dt data-t="factsCrew"></dt><dd data-t="factsCrewValue"></dd></div>
        <div><dt data-t="factsAi"></dt><dd data-t="factsAiValue"></dd></div>
        <div><dt data-t="factsPlay"></dt><dd data-t="factsPlayValue"></dd></div>
      </dl>
    </section>
    <section class="form">
      <h2 data-t="formTitle"></h2>
      <label class="field"><span data-t="yourName"></span><input id="name" maxlength="24" /></label>
      <label class="field"><span data-t="crewSize"></span>
        <select id="players">
          <option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </label>
      <fieldset class="field modes">
        <legend data-t="modeLabel"></legend>
        <label><input type="radio" name="mode" value="play" checked /> <span data-t="modePlay"></span></label>
        <label><input type="radio" name="mode" value="watch" /> <span data-t="modeWatch"></span></label>
      </fieldset>
      <label class="field"><span data-t="aiCrew"></span><select id="agent"></select></label>
      <div class="pair">
        <label class="field"><span data-t="seed"></span><input id="seed" type="number" /></label>
        <label class="field"><span data-t="pace"></span><input id="pace" type="range" min="0" max="3000" step="100" value="900" /><output id="pace-out"></output></label>
      </div>
      <button id="start" class="primary wide" data-t="descend"></button>
      <p id="server-note" class="note"></p>
      <details class="replay-load">
        <summary data-t="replayTitle"></summary>
        <label class="field"><span data-t="replayFile"></span><input id="replay-file" type="file" accept=".json,application/json" /></label>
        <label class="field"><span data-t="replayPaste"></span><textarea id="replay-paste" rows="3" data-t-ph="replayPastePh"></textarea></label>
        <button id="replay-paste-go" data-t="replayWatch"></button>
        <p id="replay-error" class="err"></p>
      </details>
    </section>
  </main>

  <main id="game" class="game" hidden>
    <aside class="roster-col">
      <h3 data-t="roster"></h3>
      <div id="roster" class="roster"></div>
    </aside>
    <section class="center">
      <div id="log" class="log"></div>
      <div id="actions" class="actions"></div>
    </section>
    <aside id="side" class="side"></aside>
  </main>
