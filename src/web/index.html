<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Undertow · Meridian-9</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-phase="setup">
  <header class="bar">
    <div class="brand"><span class="mark">Undertow</span><span class="sub" data-t="brandSub"></span></div>
    <div class="cell phase"><span id="phase"></span></div>
    <div class="cell" id="hull"></div>
    <div class="cell meta" id="meta"></div>
    <div class="lang" role="group" data-t-aria="langLabel">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="zh">中文</button>
    </div>
  </header>

  <main id="setup" class="setup">
    <div class="gauge" aria-hidden="true">
      <span style="top:0%">0 m</span><span style="top:25%">1000</span><span style="top:50%">2000</span><span style="top:75%">3000</span><span style="top:100%">4000</span>
    </div>
    <section class="intro">
      <p class="kicker" data-t="setupKicker"></p>
      <h1 data-t="setupTitle"></h1>
      <p class="lede" data-t="setupLede"></p>
      <dl class="facts">
        <div><dt data-t="factsCrew"></dt><dd data-t="factsCrewValue"></dd></div>
        <div><dt data-t="factsAi"></dt><dd data-t="factsAiValue"></dd></div>
        <div><dt data-t="factsPlay"></dt><dd data-t="factsPlayValue"></dd></div>
      </dl>
    </section>
    <section class="form">
      <h2 data-t="formTitle"></h2>
      <label class="field"><span data-t="yourName"></span><input id="name" maxlength="24" /></label>
      <label class="field"><span data-t="crewSize"></span>
        <select id="players">
          <option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </label>
      <fieldset class="field modes">
        <legend data-t="modeLabel"></legend>
        <label><input type="radio" name="mode" value="play" checked /> <span data-t="modePlay"></span></label>
        <label><input type="radio" name="mode" value="watch" /> <span data-t="modeWatch"></span></label>
      </fieldset>
      <label class="field"><span data-t="aiCrew"></span><select id="agent"></select></label>
      <div class="pair">
        <label class="field"><span data-t="seed"></span><input id="seed" type="number" /></label>
        <label class="field"><span data-t="pace"></span><input id="pace" type="range" min="0" max="3000" step="100" value="900" /><output id="pace-out"></output></label>
      </div>
      <button id="start" class="primary wide" data-t="descend"></button>
      <p id="server-note" class="note"></p>
      <details class="replay-load">
        <summary data-t="replayTitle"></summary>
        <label class="field"><span data-t="replayFile"></span><input id="replay-file" type="file" accept=".json,application/json" /></label>
        <label class="field"><span data-t="replayPaste"></span><textarea id="replay-paste" rows="3" data-t-ph="replayPastePh"></textarea></label>
        <button id="replay-paste-go" data-t="replayWatch"></button>
        <p id="replay-error" class="err"></p>
      </details>
    </section>
  </main>

  <main id="game" class="game" hidden>
    <aside class="roster-col">
      <h3 data-t="roster"></h3>
      <div id="roster" class="roster"></div>
    </aside>
    <section class="center">
      <div id="log" class="log"></div>
      <div id="actions" class="actions"></div>
    </section>
    <aside id="side" class="side"></aside>
  </main>
  <input id="pace-live" type="hidden" value="900" />
  <script type="module" src="app.js"></script>
</body>
</html>
